<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
        name="theme-color"
        content="#06382a"
    />

    <title>Set Password | ClubHub</title>

    <link
        rel="stylesheet"
        href="../styles/tokens.css"
    />

    <link
        rel="stylesheet"
        href="../styles/components.css"
    />

    <link
        rel="stylesheet"
        href="../styles/auth.css"
    />

    <link
        rel="manifest"
        href="../json/manifest.json"
    />

    <link
        rel="apple-touch-icon"
        href="../assets/Icon.PNG"
    />

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="../js/core/config.js"
    ></script>

    <script
        src="../js/core/supabase.js"
    ></script>
</head>

<body class="auth-body">
    <main class="auth-page">
        <div class="auth-shell">

            <!-- =============================================
                 CLUBHUB BRAND
                 ============================================= -->

            <section class="auth-brand">
                <img
                    class="auth-brand__logo"
                    src="../assets/branding/clubhub-logo.PNG"
                    alt="ClubHub"
                />

                <p class="auth-brand__subtitle">
                    Bells Hotel &amp; Country Club
                </p>
            </section>

            <!-- =============================================
                 SET PASSWORD
                 ============================================= -->

            <section class="auth-card">
                <div class="auth-card__heading">
                    <p class="auth-card__eyebrow">
                        Welcome to ClubHub
                    </p>

                    <h1 class="auth-card__title">
                        Set your password
                    </h1>

                    <p class="auth-card__text">
                        Your ClubHub account is ready.
                        Create a password to get started.
                    </p>
                </div>

                <form
                    id="setPasswordForm"
                    class="auth-form"
                    novalidate
                >
                    <!-- NEW PASSWORD -->

                    <label
                        class="form-group"
                        for="newPassword"
                    >
                        <span class="form-label">
                            New password
                        </span>

                        <span class="password-field">
                            <input
                                id="newPassword"
                                class="form-input"
                                type="password"
                                autocomplete="new-password"
                                placeholder="At least 8 characters"
                                minlength="8"
                                required
                            />

                            <button
                                id="newPasswordToggle"
                                class="password-toggle"
                                type="button"
                                aria-controls="newPassword"
                                aria-pressed="false"
                            >
                                Show
                            </button>
                        </span>
                    </label>

                    <!-- CONFIRM PASSWORD -->

                    <label
                        class="form-group"
                        for="confirmPassword"
                    >
                        <span class="form-label">
                            Confirm password
                        </span>

                        <span class="password-field">
                            <input
                                id="confirmPassword"
                                class="form-input"
                                type="password"
                                autocomplete="new-password"
                                placeholder="Enter it again"
                                minlength="8"
                                required
                            />

                            <button
                                id="confirmPasswordToggle"
                                class="password-toggle"
                                type="button"
                                aria-controls="confirmPassword"
                                aria-pressed="false"
                            >
                                Show
                            </button>
                        </span>
                    </label>

                    <!-- PASSWORD REQUIREMENT -->

                    <div class="password-requirement">
                        <span
                            class="password-requirement__icon"
                            aria-hidden="true"
                        >
                            ✓
                        </span>

                        <span>
                            Use at least 8 characters
                        </span>
                    </div>

                    <!-- STATUS MESSAGE -->

                    <p
                        id="setPasswordMessage"
                        class="auth-message"
                        role="status"
                        aria-live="polite"
                    ></p>

                    <!-- SUBMIT -->

                    <button
                        id="setPasswordButton"
                        class="button button--primary button--full auth-submit"
                        type="submit"
                    >
                        Set password
                    </button>
                </form>
            </section>

            <!-- =============================================
                 FOOTER
                 ============================================= -->

            <p class="auth-footer">
                Secure member access powered by ClubHub
            </p>
        </div>
    </main>

    <script
        src="../js/auth/set-password.js"
    ></script>
</body>
</html>
