<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#173f2b" />

    <title>Set Password | BookIt</title>

    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/auth.css" />

    <link rel="manifest" href="../json/manifest.json" />
    <link rel="apple-touch-icon" href="../assets/Icon.PNG" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/core/config.js"></script>
    <script src="../js/core/supabase.js"></script>
</head>

<body>
    <main class="auth-page">
        <div class="auth-container">
            <section class="auth-brand">
                <div class="auth-brand__mark" aria-hidden="true">
                    <svg
                        class="auth-brand__icon"
                        viewBox="0 0 24 24"
                    >
                        <path d="M5 21V4"></path>
                        <path d="M5 4h10l-2 4 2 4H5"></path>
                        <circle cx="15" cy="18" r="2"></circle>
                    </svg>
                </div>

                <h1 class="auth-brand__title">BookIt</h1>

                <p class="auth-brand__subtitle">
                    Bells Hotel &amp; Country Club
                </p>
            </section>

            <section class="auth-card">
                <h2 class="auth-card__title">
                    Create your password
                </h2>

                <p class="auth-card__text">
                    Choose a password for your BookIt account.
                </p>

                <form
                    id="setPasswordForm"
                    class="auth-form"
                    novalidate
                >
                    <label class="form-group" for="newPassword">
                        <span class="form-label">New password</span>

                        <span class="password-field">
                            <input
                                id="newPassword"
                                class="form-input"
                                type="password"
                                autocomplete="new-password"
                                placeholder="At least 8 characters"
                                minlength="8"
                                required
                            />

                            <button
                                id="newPasswordToggle"
                                class="password-toggle"
                                type="button"
                                aria-controls="newPassword"
                                aria-pressed="false"
                            >
                                Show
                            </button>
                        </span>
                    </label>

                    <label class="form-group" for="confirmPassword">
                        <span class="form-label">
                            Confirm password
                        </span>

                        <span class="password-field">
                            <input
                                id="confirmPassword"
                                class="form-input"
                                type="password"
                                autocomplete="new-password"
                                placeholder="Enter it again"
                                minlength="8"
                                required
                            />

                            <button
                                id="confirmPasswordToggle"
                                class="password-toggle"
                                type="button"
                                aria-controls="confirmPassword"
                                aria-pressed="false"
                            >
                                Show
                            </button>
                        </span>
                    </label>

                    <p class="form-hint">
                        Use at least 8 characters.
                    </p>

                    <p
                        id="setPasswordMessage"
                        class="auth-message"
                        role="status"
                        aria-live="polite"
                    ></p>

                    <button
                        id="setPasswordButton"
                        class="button button--primary button--full"
                        type="submit"
                    >
                        Save password
                    </button>
                </form>
            </section>
        </div>
    </main>

    <script src="../js/auth/set-password.js"></script>
</body>
</html>
