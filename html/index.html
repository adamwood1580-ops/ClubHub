<!DOCTYPE html>
<html lang="en" class="auth-protected">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#1f683d" />

    <title>BookIt | Bells Hotel & Country Club</title>

    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/app-shell.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/member-home.css" />

    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../assets/Icon.PNG" />
</head>

<body
    data-page="home"
    data-header="home"
    data-club-name="Bells Hotel & Country Club"
    >
    
    <div class="app-shell">
        <header data-app-header></header>
        <main class="app-main app-main--narrow member-home">
            <section class="member-greeting">
                <h1 class="member-greeting__title">
                    Morning Adam 👋
                </h1>

                <p class="member-greeting__subtitle">
                    Ready for golf?
                </p>
            </section>

            <section
                class="hero-card booking-hero"
                aria-labelledby="next-round-title"
            >
                <svg
                    class="booking-hero__course-art"
                    aria-hidden="true"
                    viewBox="0 0 180 130"
                >
                    <path
                        d="M15 105 C45 55, 75 95, 105 45 C125 15, 155 30, 170 10"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="24"
                        stroke-linecap="round"
                    />
                    <circle cx="158" cy="19" r="7" fill="#d4af37" />
                    <path d="M158 19V2" stroke="#ffffff" stroke-width="3" />
                    <path d="M158 3l13 5-13 5z" fill="#d4af37" />
                </svg>

                <p class="hero-card__eyebrow">
                    <svg
                        class="home-icon"
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                    >
                        <rect x="3" y="5" width="18" height="16" rx="2" />
                        <path d="M16 3v4M8 3v4M3 10h18" />
                    </svg>

                    Your next round
                </p>

                <p class="hero-card__value">09:04</p>

                <h2
                    class="hero-card__title"
                    id="next-round-title"
                >
                    Saturday, 1 August
                </h2>

                <div class="booking-hero__details">
                    <span>1st Tee</span>
                    <span>4 players</span>
                </div>

                <div
                    class="player-row"
                    aria-label="Playing with Steve, Dave and Mark"
                >
                    <span class="player-avatar" title="Steve">S</span>
                    <span class="player-avatar" title="Dave">D</span>
                    <span class="player-avatar" title="Mark">M</span>
                    <span class="player-avatar player-avatar--more">+1</span>
                </div>

                <div class="hero-card__actions">
                    <a
                        class="button button--hero button--full"
                        href="booking.html"
                    >
                        View booking

                        <span aria-hidden="true">›</span>
                    </a>
                </div>
            </section>

            <section
                class="home-summary-grid section"
                aria-label="Club information"
            >
                <article class="card summary-card">
                    <div class="summary-card__topline">
                        <span class="summary-card__dot"></span>
                        Course status
                    </div>

                    <p class="summary-card__value">Open</p>

                    <p class="summary-card__meta">
                        19°C&nbsp; • &nbsp;Light wind ☀️
                    </p>
                </article>

                <a
                    class="card card--interactive summary-card"
                    href="#competition"
                >
                    <div class="summary-card__topline">
                        <span
                            class="summary-card__icon"
                            aria-hidden="true"
                        >
                            🏆
                        </span>
                        This week
                    </div>

                    <h2 class="summary-card__title">
                        Summer Stableford
                    </h2>

                    <p class="summary-card__meta">
                        Saturday, 1 August &nbsp;›
                    </p>
                </a>
            </section>

            <section class="section">
                <div class="section__header">
                    <h2 class="section__title">Quick actions</h2>
                </div>

                <div class="quick-actions">
                    <a
                        class="quick-action quick-action--primary"
                        href="booking.html"
                    >
                        <svg
                            class="home-icon"
                            aria-hidden="true"
                            viewBox="0 0 24 24"
                        >
                            <rect x="3" y="5" width="18" height="16" rx="2" />
                            <path d="M16 3v4M8 3v4M3 10h18" />
                            <path d="M12 14v4M10 16h4" />
                        </svg>

                        Book a round
                    </a>

                    <a
                        class="quick-action quick-action--gold"
                        href="score.html"
                    >
                        <svg
                            class="home-icon"
                            aria-hidden="true"
                            viewBox="0 0 24 24"
                        >
                            <path d="m4 20 4-1 11-11-3-3L5 16l-1 4Z" />
                            <path d="m14 6 3 3" />
                        </svg>

                        Enter score
                    </a>
                </div>
            </section>
        </main>

        <nav data-bottom-nav></nav>        
        
    </div>
<script src="../js/ui/header.js"></script>
<script src="../js/ui/navigation.js"></script>
</body>
</html>
