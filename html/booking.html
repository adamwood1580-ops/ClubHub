<!DOCTYPE html>
<html lang="en" class="auth-protected">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#173f2b" />

    <title>Book a Round | BookIt</title>

    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/app-shell.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/booking.css" />

    <link rel="manifest" href="../json/manifest.json" />
    <link rel="apple-touch-icon" href="../assets/Icon.PNG" />

    <!--
        boot.js loads the Supabase library, configuration,
        Supabase client and profile service.
    -->
    <script src="../js/core/boot.js" defer></script>
</head>

<body
    data-page="book"
    data-header="standard"
    data-title="Book A Round"
>
    <div class="app-shell">
        <header data-app-header></header>

        <main class="app-main app-main--narrow booking-page">
            <section class="booking-heading">
                <p
                    id="bookingClubName"
                    class="booking-heading__eyebrow"
                >
                    Bells Hotel &amp; Country Club
                </p>

                <h1 class="booking-heading__title">
                    When would you like to play?
                </h1>

                <p class="booking-heading__subtitle">
                    Choose an available time or join an existing group.
                </p>
            </section>

            <section
                class="date-panel"
                aria-label="Select booking date"
            >
                <button
                    id="prevDay"
                    class="date-button"
                    type="button"
                    aria-label="Previous day"
                >
                    <svg
                        class="booking-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>

                <button
                    id="dateDisplay"
                    class="date-display"
                    type="button"
                    aria-label="Open calendar"
                >
                    <span
                        id="dayName"
                        class="date-display__day"
                    >
                        Loading...
                    </span>

                    <span
                        id="dateText"
                        class="date-display__date"
                    >
                        Loading...
                    </span>
                </button>

                <button
                    id="nextDay"
                    class="date-button"
                    type="button"
                    aria-label="Next day"
                >
                    <svg
                        class="booking-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                </button>

                <!--
                    Hidden native date input. The page controller can
                    connect this to the centre date button later.
                -->
                <input
                    id="bookingDatePicker"
                    class="visually-hidden"
                    type="date"
                    tabindex="-1"
                    aria-hidden="true"
                />
            </section>

            <section
                class="availability-summary"
                aria-label="Tee-time availability summary"
            >
                <div class="availability-summary__item">
                    <strong id="availableCount">0</strong>
                    <span>Available</span>
                </div>

                <div class="availability-summary__item">
                    <strong id="joinableCount">0</strong>
                    <span>Joinable</span>
                </div>

                <div class="availability-summary__item">
                    <strong id="bookedCount">0</strong>
                    <span>Booked</span>
                </div>
            </section>

            <section class="booking-controls">
                <div
                    class="filter-bar"
                    aria-label="Filter tee times"
                >
                    <button
                        class="filter-btn active"
                        data-filter="all"
                        type="button"
                        aria-pressed="true"
                    >
                        All times
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="available"
                        type="button"
                        aria-pressed="false"
                    >
                        Available
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="joinable"
                        type="button"
                        aria-pressed="false"
                    >
                        Joinable
                    </button>
                </div>
            </section>

            <section class="tee-sheet-section">
                <div class="section__header">
                    <h2 class="section__title">
                        Tee times
                    </h2>

                    <span class="tee-sheet-key">
                        7-minute intervals
                    </span>
                </div>

                <div
                    id="teeSheet"
                    class="tee-sheet"
                    aria-live="polite"
                    aria-busy="true"
                    aria-label="Available tee times"
                >
                    <p class="tee-sheet-message">
                        Loading tee times...
                    </p>
                </div>
            </section>
        </main>

        <nav data-bottom-nav></nav>
    </div>

    <!--
        Retained for the next stage when real Book and Join
        database functions are connected.
    -->
    <div
        id="bookingModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        aria-hidden="true"
    >
        <div class="modal-card">
            <div
                class="modal-handle"
                aria-hidden="true"
            ></div>

            <button
                id="closeModal"
                class="close-btn"
                type="button"
                aria-label="Close booking form"
            >
                ×
            </button>

            <p class="modal-eyebrow">
                Complete your booking
            </p>

            <h2 id="modalTitle">
                Book Tee Time
            </h2>

            <p
                id="modalTime"
                class="modal-time"
            ></p>

            <div class="booking-form">
                <label
                    class="form-group"
                    for="leadName"
                >
                    <span class="form-label">
                        Lead Booker
                    </span>

                    <input
                        id="leadName"
                        class="form-input"
                        type="text"
                        placeholder="Full name"
                        autocomplete="name"
                    />
                </label>

                <label
                    class="form-group"
                    for="contactNumber"
                >
                    <span class="form-label">
                        Contact Number
                    </span>

                    <input
                        id="contactNumber"
                        class="form-input"
                        type="tel"
                        placeholder="Mobile number"
                        autocomplete="tel"
                    />
                </label>

                <label
                    class="form-group"
                    for="playerCount"
                >
                    <span class="form-label">
                        Number of Players
                    </span>

                    <select
                        id="playerCount"
                        class="form-select"
                    >
                        <option value="1">
                            1 player
                        </option>

                        <option value="2">
                            2 players
                        </option>

                        <option value="3">
                            3 players
                        </option>

                        <option value="4">
                            4 players
                        </option>
                    </select>
                </label>

                <fieldset
                    id="bookingTypeWrap"
                    class="booking-type"
                >
                    <legend>
                        Booking Type
                    </legend>

                    <label class="booking-option">
                        <input
                            type="radio"
                            name="bookingType"
                            value="joinable"
                            checked
                        />

                        <span class="booking-option__content">
                            <strong>Joinable</strong>

                            <small>
                                Other golfers can join the remaining spaces.
                            </small>
                        </span>
                    </label>

                    <label class="booking-option">
                        <input
                            type="radio"
                            name="bookingType"
                            value="private"
                        />

                        <span class="booking-option__content">
                            <strong>Private</strong>

                            <small>
                                Keep the remaining spaces unavailable.
                            </small>
                        </span>
                    </label>
                </fieldset>

                <div
                    id="playerNames"
                    class="player-names"
                ></div>

                <button
                    id="confirmBooking"
                    class="button button--primary button--full confirm-btn"
                    type="button"
                >
                    Confirm Booking
                </button>
            </div>
        </div>
    </div>

    <!-- Reusable interface components -->
    <script src="../js/ui/header.js"></script>
    <script src="../js/ui/navigation.js"></script>

    <!-- Read-only booking data service -->
    <script src="../js/core/booking.js?v=5"></script>

    <!-- Live booking-page controller -->
    <script src="../js/pages/booking-page.js?v=5"></script>
</body>
</html>
