<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#173f2b" />

    <title>Sign In | BookIt</title>

    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/auth.css" />

    <link rel="manifest" href="../json/manifest.json" />
    <link rel="apple-touch-icon" href="../assets/Icon.PNG" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/core/config.js"></script>
    <script src="../js/core/supabase.js"></script>
</head>

<body>
    <main class="auth-page">
        <div class="auth-container">
            <section class="auth-brand" aria-labelledby="bookit-title">
                <div class="auth-brand__mark" aria-hidden="true">
                    <svg
                        class="auth-brand__icon"
                        viewBox="0 0 24 24"
                    >
                        <path d="M5 21V4"></path>
                        <path d="M5 4h10l-2 4 2 4H5"></path>
                        <circle cx="15" cy="18" r="2"></circle>
                    </svg>
                </div>

                <h1 class="auth-brand__title" id="bookit-title">
                    BookIt
                </h1>

                <p class="auth-brand__subtitle">
                    Bells Hotel &amp; Country Club
                </p>
            </section>

            <section class="auth-card" aria-labelledby="sign-in-title">
                <h2 class="auth-card__title" id="sign-in-title">
                    Welcome back
                </h2>

                <p class="auth-card__text">
                    Sign in to manage bookings, rounds and your profile.
                </p>

                <form id="loginForm" class="auth-form" novalidate>
                    <label class="form-group" for="email">
                        <span class="form-label">Email address</span>

                        <input
                            id="email"
                            class="form-input"
                            name="email"
                            type="email"
                            inputmode="email"
                            autocomplete="email"
                            placeholder="name@example.com"
                            required
                        />
                    </label>

                    <label class="form-group" for="password">
                        <span class="form-label">Password</span>

                        <span class="password-field">
                            <input
                                id="password"
                                class="form-input"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Enter your password"
                                minlength="6"
                                required
                            />

                            <button
                                id="passwordToggle"
                                class="password-toggle"
                                type="button"
                                aria-controls="password"
                                aria-pressed="false"
                            >
                                Show
                            </button>
                        </span>
                    </label>

                    <p
                        id="loginMessage"
                        class="auth-message"
                        role="status"
                        aria-live="polite"
                    ></p>

                    <div class="auth-actions">
                        <button
                            id="loginButton"
                            class="button button--primary button--full"
                            type="submit"
                        >
                            Sign in
                        </button>

                        <a class="auth-link" href="#forgot-password">
                            Forgotten your password?
                        </a>
                    </div>
                </form>
            </section>

            <p class="auth-footer">
                Simple enough for everyone. Powerful enough for every club.
            </p>
        </div>
    </main>

    <script src="../js/auth/login.js"></script>
</body>
</html>
