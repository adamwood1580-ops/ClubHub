<!DOCTYPE html>
<html lang="en" class="auth-styles-loading">
<head>
    <style>
        html,
        body {
            min-height: 100%;
            margin: 0;
            background: #06382a;
        }

        body {
            color: #ffffff;
        }

        html.auth-styles-loading .auth-panel {
            opacity: 0;
            visibility: hidden;
        }

        html.auth-ready .auth-panel {
            opacity: 1;
            visibility: visible;
        }
    </style>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
        name="theme-color"
        content="#06382a"
    />

    <title>Sign In | ClubHub</title>

    <link
        rel="stylesheet"
        href="../styles/tokens.css"
    />

    <link
        rel="stylesheet"
        href="../styles/components.css"
    />

    <link
        rel="stylesheet"
        href="../styles/auth.css?brand=8"
        onload="
            document.documentElement.classList.remove('auth-styles-loading');
            document.documentElement.classList.add('auth-ready');
        "
    />

    <noscript>
        <style>
            html.auth-styles-loading .auth-panel {
                opacity: 1;
                visibility: visible;
            }
        </style>
    </noscript>

    <link
        rel="manifest"
        href="../manifest.json"
    />

    <link
        rel="apple-touch-icon"
        href="../assets/Icon.PNG"
    />
</head>

<body class="auth-page">
    <main class="auth-layout">
        <section
            class="auth-panel"
            aria-labelledby="clubhubWordmark"
        >
            <!-- =============================================
                 CLUBHUB BRAND
                 ============================================= -->

            <header class="auth-brand">
                <img
                    src="../assets/branding/clubhub-logo.PNG?brand=5"
                    alt=""
                    class="clubhub-logo"
                    aria-hidden="true"
                />

                <h1
                    id="clubhubWordmark"
                    class="clubhub-wordmark"
                >
                    <span class="clubhub-wordmark__club">
                        Club
                    </span><span class="clubhub-wordmark__hub">Hub</span>
                </h1>

                <p class="auth-tagline">
                    <span>
                        Designed for the club.
                    </span>

                    <span>
                        Built for the golfer.
                    </span>
                </p>
            </header>

            <!-- =============================================
                 LOGIN FORM
                 ============================================= -->

            <form
                id="loginForm"
                class="auth-form"
                novalidate
            >
                <div class="auth-fields">
                    <div class="auth-field">
                        <label
                            class="visually-hidden"
                            for="email"
                        >
                            Email address
                        </label>

                        <span
                            class="auth-field__icon"
                            aria-hidden="true"
                        >
                            <svg viewBox="0 0 24 24">
                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                />

                                <path
                                    d="m4 7 8 6 8-6"
                                />
                            </svg>
                        </span>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            inputmode="email"
                            autocomplete="email"
                            autocapitalize="none"
                            spellcheck="false"
                            placeholder="Email address"
                            required
                        />
                    </div>

                    <div class="auth-field">
                        <label
                            class="visually-hidden"
                            for="password"
                        >
                            Password
                        </label>

                        <span
                            class="auth-field__icon"
                            aria-hidden="true"
                        >
                            <svg viewBox="0 0 24 24">
                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="11"
                                    rx="2"
                                />

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                />
                            </svg>
                        </span>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Password"
                            required
                        />

                        <button
                            id="passwordToggle"
                            class="auth-field__toggle"
                            type="button"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg
                                class="password-eye password-eye--show"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="
                                        M2 12
                                        C4.8 7.8 8.1 6 12 6
                                        C15.9 6 19.2 7.8 22 12
                                        C19.2 16.2 15.9 18 12 18
                                        C8.1 18 4.8 16.2 2 12Z
                                    "
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />
                            </svg>
                        </button>
                    </div>

                    <button
                        id="loginButton"
                        class="auth-submit"
                        type="submit"
                    >
                        <span class="auth-submit__label">
                            Sign In
                        </span>

                        <span
                            class="auth-submit__spinner"
                            aria-hidden="true"
                        ></span>
                    </button>
                </div>

                <p
                    id="loginMessage"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>
            </form>

            <!-- =============================================
                 SECONDARY ACTIONS
                 ============================================= -->

            <footer class="auth-footer">
                <a
                    class="auth-link auth-link--password"
                    href="forgot-password.html"
                >
                    Forgot password?
                </a>

                <p class="auth-club-contact">
                    New here?

                    <a href="mailto:">
                        Contact your club.
                    </a>
                </p>
            </footer>
        </section>
    </main>

    <script src="../js/core/config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/core/supabase.js"></script>

    <script src="../js/auth/login.js"></script>
</body>
</html>
